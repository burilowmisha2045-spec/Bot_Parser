<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Мессенджер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Onest:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:          #0d1520;
  --surface:     #131f2e;
  --panel:       #1e2a3a;
  --panel-deep:  #162030;
  --border:      #2a3f58;
  --border-lite: #243348;
  --accent:      #2e6da4;
  --accent-hi:   #5aabf0;
  --accent-glow: rgba(90,171,240,0.18);
  --text:        #d0e4f5;
  --text-soft:   #6a8aaa;
  --text-dim:    #3a5570;
  --highlight:   rgba(90,171,240,0.28);
  --green:       #3effa0;
  --red:         #ff5c6a;
  --yellow:      #ffd166;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Onest', sans-serif;
  background: var(--bg);
  height: 100vh;
  height: 100dvh;
  display: flex;
  margin: 0;
  padding: 0;
  overflow: hidden;
}

.shell {
  width: 100%;
  height: 100vh;
  height: 100dvh;
  background: var(--surface);
  overflow: hidden;
  display: grid;
  grid-template-columns: 240px 1fr 260px;
}

/* ── ЛЕВАЯ ПАНЕЛЬ АККАУНТОВ ── */
.accounts-zone {
  background: var(--panel-deep);
  border-right: 2px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.accounts-header {
  background: var(--panel);
  padding: 15px 12px;
  flex-shrink: 0;
  border-bottom: 2px solid var(--border);
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.accounts-header h3 {
  font-family: 'Unbounded', sans-serif;
  font-size: 9px; font-weight: 700;
  color: var(--text-soft);
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.accounts-header .count-badge {
  font-family: 'Unbounded', sans-serif;
  font-size: 9px; font-weight: 700;
  color: var(--accent-hi);
  background: rgba(90,171,240,0.12);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 2px 6px;
  flex-shrink: 0;
}

.users-bar {
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
  flex: 1;
}
.users-bar::-webkit-scrollbar { width: 4px; }
.users-bar::-webkit-scrollbar-track { background: transparent; }
.users-bar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.account-group {
  border-bottom: 1px solid var(--border-lite);
}

.account-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  cursor: pointer;
  background: var(--panel);
  transition: background 0.15s;
  position: sticky;
  top: 0;
  z-index: 2;
  user-select: none;
}
.account-row:hover { background: rgba(255,255,255,0.05); }
.account-row.open  { background: rgba(90,171,240,0.08); }

.account-row .acc-avatar {
  width: 28px; height: 28px;
  border-radius: 4px;
  background: rgba(90,171,240,0.15);
  color: var(--accent-hi);
  font-family: 'Unbounded', sans-serif;
  font-size: 9px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  border: 1px solid var(--border);
}
.account-row .acc-body { flex: 1; min-width: 0; }
.account-row .acc-name {
  font-family: 'Unbounded', sans-serif;
  font-size: 10px; font-weight: 700;
  color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.account-row .acc-sub {
  font-size: 10px; color: var(--text-dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.account-row .acc-toggle {
  font-size: 10px; color: var(--text-dim);
  transition: transform 0.2s;
  flex-shrink: 0;
}
.account-row.open .acc-toggle { transform: rotate(90deg); }

.account-users {
  display: none;
  flex-direction: column;
  gap: 4px;
  padding: 5px 7px 7px 7px;
  background: var(--panel-deep);
}
.account-users.open { display: flex; }

.chip-skeleton {
  width: 100%;
  height: 38px;
  border-radius: 5px;
  background: linear-gradient(90deg, var(--panel-deep) 25%, var(--border) 50%, var(--panel-deep) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
  flex-shrink: 0;
  margin: 5px 0;
}
@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* ── ЧИП ПОЛЬЗОВАТЕЛЯ ── */
.user-chip {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(90,171,240,0.04);
  border: 2px solid var(--border-lite);
  border-radius: 5px;
  padding: 6px 10px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, transform 0.12s, box-shadow 0.15s;
  flex-shrink: 0;
  width: 100%;
}
.user-chip:hover {
  background: rgba(255,255,255,0.07);
  border-color: #fff;
  box-shadow: 0 0 0 1px #fff, 0 4px 14px rgba(0,0,0,0.4);
  transform: translateX(2px);
}
.user-chip:hover .chip-name { color: #fff; }
.user-chip:hover .avatar    { border-color: #fff; color: #fff; }
.user-chip.active {
  background: var(--accent);
  border-color: var(--accent-hi);
  box-shadow: 0 0 0 1px var(--accent-hi);
}
.user-chip.active .chip-name { color: #fff; font-weight: 700; }
.user-chip.active .avatar    { background: rgba(255,255,255,0.15); color: #fff; border-color: rgba(255,255,255,0.3); }

/* индикатор нового сообщения */
.user-chip.has-new {
  border-color: var(--accent-hi);
}
.user-chip.has-new .chip-name::after {
  content: ' •';
  color: var(--accent-hi);
  font-size: 14px;
  line-height: 1;
}

.avatar {
  width: 27px; height: 27px;
  border-radius: 4px;
  background: rgba(90,171,240,0.12);
  color: var(--accent-hi);
  font-family: 'Unbounded', sans-serif;
  font-size: 9px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  border: 1px solid var(--border);
  transition: border-color 0.15s, color 0.15s;
}
.chip-body { flex: 1; min-width: 0; }
.chip-name {
  font-size: 12px; font-weight: 500;
  color: #8ab4d8;
  transition: color 0.15s;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.chip-sub {
  font-size: 9px; color: var(--text-dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px;
}
.user-chip.active .chip-sub { color: rgba(255,255,255,0.5); }

/* ── MESSAGES ZONE ── */
.messages-zone {
  background: var(--panel-deep);
  border-right: 2px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

.no-user-placeholder {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text-dim);
  gap: 10px;
  padding: 30px;
  text-align: center;
}
.no-user-placeholder .icon { font-size: 44px; opacity: 0.25; }
.no-user-placeholder p {
  font-family: 'Unbounded', sans-serif;
  font-size: 12px; font-weight: 600;
  color: var(--text-dim);
}

#chatArea {
  display: none;
  flex: 1;
  flex-direction: column;
  overflow: hidden;
}
#chatArea.visible { display: flex; }

.messages-header {
  background: var(--panel);
  padding: 11px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  border-bottom: 2px solid var(--border);
  height: 56px;
}
.messages-header .avatar-lg {
  width: 34px; height: 34px;
  border-radius: 5px;
  background: rgba(90,171,240,0.12);
  color: var(--accent-hi);
  font-family: 'Unbounded', sans-serif;
  font-size: 11px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  border: 2px solid var(--border);
}
.messages-header .user-info  { flex: 1; min-width: 0; }
.messages-header .user-name  {
  font-family: 'Unbounded', sans-serif;
  font-size: 13px; font-weight: 700;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.messages-header .user-status {
  font-size: 11px;
  color: var(--text-soft);
  margin-top: 2px;
}

/* ── ИНДИКАТОР АВТО-ОБНОВЛЕНИЯ ── */
.live-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--green);
  flex-shrink: 0;
  box-shadow: 0 0 6px var(--green);
  animation: pulse-dot 2s ease-in-out infinite;
}
.live-dot.paused {
  background: var(--text-dim);
  box-shadow: none;
  animation: none;
}
.live-dot.error {
  background: var(--red);
  box-shadow: 0 0 6px var(--red);
  animation: none;
}
@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%       { opacity: 0.45; transform: scale(0.75); }
}

.refresh-btn {
  background: transparent;
  border: 1.5px solid var(--border);
  border-radius: 5px;
  padding: 5px 9px;
  color: var(--text-soft);
  font-size: 14px;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s, transform 0.2s;
  flex-shrink: 0;
}
.refresh-btn:hover { border-color: var(--accent-hi); color: var(--accent-hi); }
.refresh-btn.spinning { animation: spin 0.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.messages-list {
  flex: 1;
  overflow-y: auto;
  padding: 16px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  scroll-behavior: smooth;
}
.messages-list::-webkit-scrollbar { width: 4px; }
.messages-list::-webkit-scrollbar-track { background: transparent; }
.messages-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.msg {
  max-width: 78%;
  padding: 9px 13px;
  border-radius: 6px;
  font-size: 13px;
  line-height: 1.55;
  color: var(--text);
  transition: background 0.2s;
}
.msg.incoming {
  background: var(--panel);
  border: 2px solid var(--border);
  align-self: flex-start;
  border-bottom-left-radius: 2px;
}
.msg.outgoing {
  background: var(--accent);
  border: 2px solid var(--accent-hi);
  align-self: flex-end;
  border-bottom-right-radius: 2px;
  color: #fff;
}

.msg-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 5px;
  flex-wrap: wrap;
}
.msg-time {
  font-size: 10px;
  color: var(--text-soft);
  opacity: 0.7;
  margin-left: auto;
}
.msg.outgoing .msg-time { color: rgba(255,255,255,0.6); }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 9px;
  font-family: 'Unbounded', sans-serif;
  font-weight: 700;
  letter-spacing: 0.06em;
  padding: 2px 6px;
  border-radius: 3px;
  flex-shrink: 0;
}
.badge-edited {
  background: rgba(255,209,102,0.15);
  color: var(--yellow);
  border: 1px solid rgba(255,209,102,0.35);
}
.badge-deleted {
  background: rgba(255,92,106,0.12);
  color: var(--red);
  border: 1px solid rgba(255,92,106,0.3);
}
.badge-new {
  background: rgba(62,255,160,0.13);
  color: var(--green);
  border: 1px solid rgba(62,255,160,0.3);
  animation: fadeout-badge 4s forwards;
}
@keyframes fadeout-badge {
  0%   { opacity: 1; }
  70%  { opacity: 1; }
  100% { opacity: 0; width: 0; padding: 0; margin: 0; border: none; overflow: hidden; }
}

.msg.is-deleted {
  opacity: 0.52;
}
.msg.is-deleted .msg-text {
  text-decoration: line-through;
  text-decoration-color: var(--red);
}

.old-text-block {
  margin-top: 5px;
  padding: 5px 8px;
  background: rgba(0,0,0,0.25);
  border-left: 2px solid rgba(255,209,102,0.4);
  border-radius: 3px;
  font-size: 11px;
  color: var(--text-soft);
  font-style: italic;
}
.old-text-label {
  font-size: 9px;
  font-family: 'Unbounded', sans-serif;
  font-weight: 700;
  color: var(--yellow);
  opacity: 0.7;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 2px;
}

.msg-type-icon {
  font-size: 11px;
  opacity: 0.65;
}

.msg.highlighted {
  background: rgba(90,171,240,0.25) !important;
  border-color: var(--accent-hi) !important;
  outline: 1px solid var(--accent-hi);
}
mark {
  background: var(--highlight);
  color: #fff;
  border-radius: 2px;
  padding: 0 2px;
}

/* ── ПОИСК ── */
.search-zone {
  background: var(--panel-deep);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.search-header {
  background: var(--panel);
  padding: 11px 12px;
  flex-shrink: 0;
  border-bottom: 2px solid var(--border);
  height: 56px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.search-header h3 {
  font-family: 'Unbounded', sans-serif;
  font-size: 9px; font-weight: 700;
  color: var(--text-soft);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 5px;
}
.search-input-wrap {
  display: flex;
  gap: 5px;
}
.search-input-wrap input {
  flex: 1;
  background: var(--panel-deep);
  border: 2px solid var(--border);
  border-radius: 5px;
  padding: 5px 9px;
  font-family: 'Onest', sans-serif;
  font-size: 12px;
  color: var(--text);
  outline: none;
  transition: border-color 0.15s;
}
.search-input-wrap input::placeholder { color: var(--text-dim); }
.search-input-wrap input:focus { border-color: var(--accent-hi); }
.search-input-wrap button {
  background: var(--border);
  border: 2px solid var(--border);
  border-radius: 5px;
  padding: 5px 9px;
  color: var(--text-soft);
  font-size: 11px;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.search-input-wrap button:hover { background: var(--accent); color: #fff; border-color: var(--accent-hi); }
.search-count { font-size: 10px; color: var(--accent-hi); opacity: 0.8; margin-top: 2px; }

.search-results {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

.search-section-label {
  font-family: 'Unbounded', sans-serif;
  font-size: 8px; font-weight: 700;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  padding: 6px 4px 2px;
}

.search-result-item {
  background: var(--panel);
  border: 2px solid var(--border-lite);
  border-radius: 5px;
  padding: 8px 10px;
  cursor: pointer;
  transition: border-color 0.15s, transform 0.12s, background 0.15s;
  font-size: 12px;
  color: var(--text);
  line-height: 1.5;
}
.search-result-item:hover { border-color: var(--accent-hi); background: var(--accent-glow); transform: translateX(-2px); }
.search-result-item .result-from {
  font-family: 'Unbounded', sans-serif;
  font-size: 8px; font-weight: 700;
  color: var(--accent-hi);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 3px;
  opacity: 0.8;
}

.user-result-chip {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--panel);
  border: 2px solid var(--border-lite);
  border-radius: 5px;
  padding: 7px 9px;
  cursor: pointer;
  transition: border-color 0.15s, transform 0.12s, background 0.15s;
}
.user-result-chip:hover { border-color: var(--accent-hi); background: var(--accent-glow); transform: translateX(-2px); }
.user-result-chip .urc-avatar {
  width: 26px; height: 26px; border-radius: 4px;
  background: rgba(90,171,240,0.12); color: var(--accent-hi);
  font-family: 'Unbounded', sans-serif; font-size: 8px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; border: 1px solid var(--border);
}
.user-result-chip .urc-body { flex: 1; min-width: 0; }
.user-result-chip .urc-name { font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-result-chip .urc-sub  { font-size: 10px; color: var(--text-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-result-chip .urc-acct { font-size: 9px; color: var(--text-dim); margin-top: 1px; }

.no-results {
  padding: 20px;
  text-align: center;
  color: var(--text-dim);
  font-size: 11px;
  font-family: 'Unbounded', sans-serif;
  font-weight: 600;
}

.state-msg {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 24px;
  color: var(--text-dim);
  font-size: 11px;
  font-family: 'Unbounded', sans-serif;
  font-weight: 600;
  text-align: center;
  flex: 1;
}
.state-msg .icon { font-size: 28px; opacity: 0.3; }

/* ── Мобильная адаптация ── */
@media (max-width: 768px) {
  .shell {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr auto;
  }
  .accounts-zone {
    max-height: 25vh;
    border-right: none;
    border-bottom: 2px solid var(--border);
  }
  .search-zone {
    max-height: 30vh;
    border-top: 2px solid var(--border);
  }
  .msg { max-width: 90%; }
}

/* ── TOGGLE BUTTON FOR ACCOUNTS PANEL ── */
.panel-toggle {
  position: absolute;
  left: 240px;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 18px;
  height: 48px;
  background: var(--panel);
  border: 2px solid var(--border);
  border-radius: 0 6px 6px 0;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 100;
  transition: left 0.3s ease, background 0.15s, border-color 0.15s;
  box-shadow: 2px 0 8px rgba(0,0,0,0.3);
}
.panel-toggle:hover {
  background: var(--accent);
  border-color: var(--accent-hi);
}
.panel-toggle .arrow {
  font-size: 10px;
  color: var(--text-soft);
  transition: transform 0.3s ease, color 0.15s;
  user-select: none;
}
.panel-toggle:hover .arrow { color: #fff; }

.shell.accounts-collapsed { grid-template-columns: 0px 1fr 260px; }
.shell.accounts-collapsed .accounts-zone { opacity: 0; pointer-events: none; }
.shell.accounts-collapsed .panel-toggle { left: 0px; border-radius: 0 6px 6px 0; }
.shell.accounts-collapsed .panel-toggle .arrow { transform: rotate(180deg); }

.accounts-zone { transition: opacity 0.25s ease; }
.shell { transition: grid-template-columns 0.3s ease; }

@media (max-width: 768px) { .panel-toggle { display: none; } }
</style>
</head>
<body>

<div class="shell">
  <div class="accounts-zone">
    <div class="accounts-header">
      <h3>👥 Аккаунты</h3>
      <span class="count-badge" id="accountsCount">0</span>
    </div>
    <div class="users-bar" id="usersBar">
      <div class="chip-skeleton"></div>
      <div class="chip-skeleton"></div>
      <div class="chip-skeleton"></div>
      <div class="chip-skeleton"></div>
    </div>
  </div>
  <div class="panel-toggle" id="panelToggle" onclick="toggleAccountsPanel()" title="Скрыть/показать панель аккаунтов">
    <span class="arrow" id="panelArrow">◀</span>
  </div>

  <div class="messages-zone" id="messagesZone">
    <div class="no-user-placeholder" id="noUserPlaceholder">
      <div class="icon">💬</div>
      <p>Выберите пользователя<br>в левой панели</p>
    </div>

    <div id="chatArea">
      <div class="messages-header">
        <div class="avatar-lg" id="headerAvatar"></div>
        <div class="user-info">
          <div class="user-name" id="headerName"></div>
          <div class="user-status" id="headerStatus"></div>
        </div>
        <div class="live-dot" id="liveDot" title="Авто-обновление активно"></div>
        <button class="refresh-btn" id="refreshBtn" title="Обновить вручную" onclick="refreshMessages()">↻</button>
      </div>
      <div class="messages-list" id="messagesList"></div>
    </div>
  </div>

  <div class="search-zone">
    <div class="search-header">
      <h3>🔍 Поиск</h3>
      <div class="search-input-wrap">
        <input type="text" id="searchInput" placeholder="Сообщение, имя, @username…" oninput="doSearch()" />
        <button onclick="clearSearch()">✕</button>
      </div>
      <div class="search-count" id="searchCount"></div>
    </div>
    <div class="search-results" id="searchResults">
      <div class="no-results">Введите запрос для поиска</div>
    </div>
  </div>
</div>

<script>
'use strict';

// ══════════════════════════════════════════════════════════
// ЛОГГЕР — все ошибки и события пишем в консоль браузера
// с единым форматом и уровнями: info / warn / error
// ══════════════════════════════════════════════════════════
const logger = {
  _fmt: (lvl, msg, data) => {
    const ts = new Date().toLocaleTimeString('ru-RU');
    const prefix = `[${ts}] [Monitor/${lvl}]`;
    if (data !== undefined) console[lvl === 'error' ? 'error' : lvl === 'warn' ? 'warn' : 'log'](prefix, msg, data);
    else                     console[lvl === 'error' ? 'error' : lvl === 'warn' ? 'warn' : 'log'](prefix, msg);
  },
  info:  (msg, data) => logger._fmt('info',  msg, data),
  warn:  (msg, data) => logger._fmt('warn',  msg, data),
  error: (msg, data) => logger._fmt('error', msg, data),
};

// ══════════════════════════════════════════════════════════
// КОНФИГУРАЦИЯ
// ══════════════════════════════════════════════════════════
// Замените на реальный адрес вашего сервера с bot_3.py
const API_BASE        = 'http://localhost:8000';
const POLL_INTERVAL   = 5000;   // мс — интервал авто-обновления (5 сек)
const POLL_ERROR_MAX  = 5;       // после N ошибок подряд — пауза

// ══════════════════════════════════════════════════════════
// СОСТОЯНИЕ ПРИЛОЖЕНИЯ
// ══════════════════════════════════════════════════════════
let accounts    = [];          // [ { id, name, initials, open, users:[] } ]
let messages    = {};          // { userId: [ ...msg ] }
let activeUser  = null;        // текущий выбранный пользователь

// Курсор инкрементальных обновлений
let maxRowid    = 0;
let pollTimer   = null;
let pollErrors  = 0;
let pollActive  = true;

// ══════════════════════════════════════════════════════════
// TELEGRAM MINI APP
// ══════════════════════════════════════════════════════════
if (window.Telegram && window.Telegram.WebApp) {
  window.Telegram.WebApp.ready();
  window.Telegram.WebApp.expand();
}

// ══════════════════════════════════════════════════════════
// API СЛОЙ — все fetch с подробным логированием ошибок
// ══════════════════════════════════════════════════════════
async function apiFetch(path, label) {
  const url = `${API_BASE}${path}`;
  logger.info(`→ ${label}`, url);
  let resp;
  try {
    resp = await fetch(url);
  } catch (networkErr) {
    logger.error(`${label}: сетевая ошибка (сервер недоступен?)`, networkErr);
    throw new Error(`Сетевая ошибка: ${networkErr.message}`);
  }
  if (!resp.ok) {
    let body = '';
    try { body = await resp.text(); } catch (_) {}
    logger.error(`${label}: HTTP ${resp.status}`, { url, body });
    throw new Error(`HTTP ${resp.status}: ${body.slice(0, 200)}`);
  }
  let json;
  try {
    json = await resp.json();
  } catch (parseErr) {
    logger.error(`${label}: не удалось распарсить JSON`, parseErr);
    throw new Error(`Ошибка парсинга JSON: ${parseErr.message}`);
  }
  if (json && json.error) {
    logger.error(`${label}: сервер вернул ошибку`, json.error);
    throw new Error(`Ошибка сервера: ${json.error}`);
  }
  logger.info(`← ${label} OK`);
  return json;
}

async function fetchUsers() {
  return apiFetch('/api/users', 'fetchUsers');
}

async function fetchMessages(bizId, rawUserInfo) {
  const encoded = encodeURIComponent(rawUserInfo);
  return apiFetch(`/api/messages/${encodeURIComponent(bizId)}/${encoded}`, 'fetchMessages');
}

async function fetchUpdates(sinceRowid) {
  return apiFetch(`/api/updates?since=${sinceRowid}`, 'fetchUpdates');
}

// ══════════════════════════════════════════════════════════
// ИНИЦИАЛИЗАЦИЯ
// ══════════════════════════════════════════════════════════
async function init() {
  logger.info('init: загружаем пользователей…');
  try {
    const data = await fetchUsers();
    // /api/users теперь возвращает сгруппированные аккаунты
    accounts = Array.isArray(data) ? data : [];
    accounts.forEach(acc => {
      if (acc.open === undefined) acc.open = true;
      if (!Array.isArray(acc.users)) acc.users = [];
    });
    logger.info('init: загружено аккаунтов', accounts.length);
    buildUsersBar();

    // Загружаем начальный max_rowid через /api/updates?since=0
    try {
      const upd = await fetchUpdates(0);
      maxRowid = upd.max_rowid || 0;
      logger.info('init: начальный max_rowid', maxRowid);
    } catch (e) {
      logger.warn('init: не удалось получить начальный rowid', e);
    }

    startPolling();
  } catch (err) {
    logger.error('init: критическая ошибка загрузки пользователей', err);
    const bar = document.getElementById('usersBar');
    bar.innerHTML = `<div style="color:var(--red);font-size:11px;padding:14px;font-family:'Onest',sans-serif;">
      ⚠️ Не удалось загрузить пользователей.<br>
      <span style="color:var(--text-dim);font-size:10px;">${esc(err.message)}</span><br><br>
      <span style="color:var(--text-dim);font-size:10px;">Убедитесь, что bot_3.py запущен и API_BASE указан верно.</span>
    </div>`;
    document.getElementById('accountsCount').textContent = '0';
    setLiveDot('error');
  }
}

// ══════════════════════════════════════════════════════════
// POLLING — инкрементальные обновления через /api/updates
// ══════════════════════════════════════════════════════════
function startPolling() {
  if (pollTimer) clearTimeout(pollTimer);
  logger.info('startPolling: интервал', POLL_INTERVAL + 'мс');
  schedulePoll();
}

function schedulePoll() {
  const delay = pollErrors > 0
    ? Math.min(POLL_INTERVAL * Math.pow(2, pollErrors - 1), 60000) // exponential backoff
    : POLL_INTERVAL;
  pollTimer = setTimeout(doPoll, delay);
}

async function doPoll() {
  if (!pollActive) {
    logger.info('doPoll: polling на паузе');
    schedulePoll();
    return;
  }

  try {
    const upd = await fetchUpdates(maxRowid);

    if (upd.max_rowid && upd.max_rowid > maxRowid) {
      logger.info('doPoll: получено обновлений', upd.messages.length,
                  `(rowid ${maxRowid} → ${upd.max_rowid})`);
      maxRowid = upd.max_rowid;

      // Если изменился список пользователей — перезагружаем левую панель
      if (upd.users_changed) {
        logger.info('doPoll: список пользователей изменился, перезагружаем…');
        try {
          const newAccounts = await fetchUsers();
          mergeAccounts(newAccounts);
          buildUsersBar();
        } catch (e) {
          logger.warn('doPoll: не удалось обновить список пользователей', e);
        }
      }

      // Применяем новые/изменённые сообщения к кешу
      if (upd.messages.length > 0) {
        applyUpdates(upd.messages);
      }
    }

    pollErrors = 0;
    setLiveDot('ok');
  } catch (err) {
    pollErrors++;
    logger.error(`doPoll: ошибка (${pollErrors}/${POLL_ERROR_MAX})`, err);
    if (pollErrors >= POLL_ERROR_MAX) {
      setLiveDot('error');
      logger.warn('doPoll: слишком много ошибок, включён backoff');
    } else {
      setLiveDot('ok');
    }
  }

  schedulePoll();
}

/**
 * Применяем пришедшие дельта-записи к локальному кешу messages{}.
 * Если активный чат затронут — перерисовываем сообщения.
 */
function applyUpdates(newMsgs) {
  const touchedUsers = new Set();

  newMsgs.forEach(rec => {
    const userId = `${rec.biz_id}::${rec.user_info}`;
    touchedUsers.add(userId);

    if (!messages[userId]) messages[userId] = [];
    const cache = messages[userId];

    // ищем существующее сообщение по m_id
    const existIdx = cache.findIndex(m => m.m_id === rec.m_id);
    // строим объект в формате как fetchMessages возвращает
    const msgObj = {
      rowid:      rec.rowid,
      m_id:       rec.m_id,
      text:       rec.text || '',
      old_text:   rec.old_text || '',
      m_type:     rec.m_type,
      file_path:  rec.file_path || '',
      status:     rec.status || 'normal',
      is_edited:  rec.is_edited,
      is_deleted: rec.is_deleted,
      ts:         rec.ts || '',
      _isNew:     existIdx === -1, // флаг «только что пришло»
    };

    if (existIdx !== -1) {
      cache[existIdx] = msgObj;
      logger.info('applyUpdates: обновлено сообщение m_id=' + rec.m_id + ' статус=' + rec.status);
    } else {
      cache.push(msgObj);
      logger.info('applyUpdates: новое сообщение m_id=' + rec.m_id + ' от ' + rec.user_info);
    }
  });

  // Если текущий открытый чат затронут — перерисовать
  if (activeUser && touchedUsers.has(activeUser.id)) {
    logger.info('applyUpdates: перерисовываем активный чат');
    const query = document.getElementById('searchInput').value.trim();
    renderMessages(messages[activeUser.id], query);
    const total = messages[activeUser.id].length;
    document.getElementById('headerStatus').textContent = `всего ${total}`;
  }

  // Обновляем индикаторы «есть новые» у чипов в левой панели
  touchedUsers.forEach(uid => {
    if (!activeUser || activeUser.id !== uid) {
      const chip = document.querySelector(`.user-chip[data-id="${CSS.escape(uid)}"]`);
      if (chip) chip.classList.add('has-new');
    }
  });
}

/**
 * Мерджим свежий список аккаунтов (с сервера) в текущий,
 * сохраняя локальные флаги open и не сбрасывая активного пользователя.
 */
function mergeAccounts(newAccounts) {
  if (!Array.isArray(newAccounts)) return;
  const openState = {};
  accounts.forEach(acc => { openState[acc.id] = acc.open; });

  accounts = newAccounts.map(acc => ({
    ...acc,
    open: openState[acc.id] !== undefined ? openState[acc.id] : true,
    users: Array.isArray(acc.users) ? acc.users : [],
  }));
  logger.info('mergeAccounts: аккаунтов после мерджа', accounts.length);
}

// ══════════════════════════════════════════════════════════
// ИНДИКАТОР LIVE-DOT
// ══════════════════════════════════════════════════════════
function setLiveDot(state) {
  const dot = document.getElementById('liveDot');
  if (!dot) return;
  dot.className = 'live-dot' + (state === 'error' ? ' error' : state === 'paused' ? ' paused' : '');
  dot.title = state === 'error'  ? 'Авто-обновление: ошибка подключения'
            : state === 'paused' ? 'Авто-обновление: на паузе'
            : 'Авто-обновление активно';
}

// ══════════════════════════════════════════════════════════
// ПОСТРОЕНИЕ ДРЕВА АККАУНТОВ И ПОЛЬЗОВАТЕЛЕЙ
// ══════════════════════════════════════════════════════════
function buildUsersBar() {
  const bar = document.getElementById('usersBar');
  bar.innerHTML = '';

  // Считаем всех пользователей по всем аккаунтам
  const totalUsers = accounts.reduce((s, a) => s + (a.users || []).length, 0);
  document.getElementById('accountsCount').textContent = totalUsers;

  if (!accounts.length) {
    bar.innerHTML = `<div class="no-results" style="padding:20px">Нет аккаунтов</div>`;
    return;
  }

  accounts.forEach(acc => {
    const group = document.createElement('div');
    group.className = 'account-group';

    const row = document.createElement('div');
    row.className = 'account-row' + (acc.open ? ' open' : '');
    const usersLen = (acc.users || []).length;
    row.innerHTML = `
      <div class="acc-avatar">${esc(acc.initials || '??')}</div>
      <div class="acc-body">
        <div class="acc-name">${esc(acc.name || acc.id)}</div>
        <div class="acc-sub">${usersLen} чат${usersLen === 1 ? '' : 'ов'}</div>
      </div>
      <span class="acc-toggle">›</span>
    `;
    row.onclick = () => {
      acc.open = !acc.open;
      buildUsersBar();
    };
    group.appendChild(row);

    const userList = document.createElement('div');
    userList.className = 'account-users' + (acc.open ? ' open' : '');

    if (acc.open && usersLen > 0) {
      const nameCounts = {};
      acc.users.forEach(u => { nameCounts[u.name] = (nameCounts[u.name] || 0) + 1; });

      acc.users.forEach(u => {
        const chip = document.createElement('div');
        const isActive = activeUser && activeUser.id === u.id;
        chip.className = 'user-chip' + (isActive ? ' active' : '');
        chip.dataset.id = u.id;

        const hasDupe = nameCounts[u.name] > 1;
        const nameHtml = hasDupe
          ? `${esc(u.name)} <span style="opacity:0.5;font-size:10px">#${String(u.id).slice(-4)}</span>`
          : esc(u.name);

        chip.innerHTML = `
          <div class="avatar">${esc(u.initials || '??')}</div>
          <div class="chip-body">
            <div class="chip-name">${nameHtml}</div>
            ${u.last_ts ? `<div class="chip-sub">${formatTs(u.last_ts)}</div>` : ''}
          </div>
        `;
        chip.onclick = () => selectUser(u);
        userList.appendChild(chip);
      });
    } else if (acc.open && usersLen === 0) {
      userList.innerHTML = `<div style="padding:8px;font-size:10px;color:var(--text-dim)">Нет пользователей</div>`;
    }

    group.appendChild(userList);
    bar.appendChild(group);
  });

  requestAnimationFrame(() => {
    const active = bar.querySelector('.user-chip.active');
    if (active) active.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });
}

async function selectUser(user) {
  logger.info('selectUser', user.id);
  activeUser = user;

  // Снимаем индикатор «новые» с выбранного чипа
  const chip = document.querySelector(`.user-chip[data-id="${CSS.escape(user.id)}"]`);
  if (chip) chip.classList.remove('has-new');

  buildUsersBar();

  document.getElementById('noUserPlaceholder').style.display = 'none';
  document.getElementById('chatArea').classList.add('visible');
  document.getElementById('headerAvatar').textContent = user.initials || '??';
  document.getElementById('headerName').textContent   = user.name;
  document.getElementById('headerStatus').textContent = 'загрузка…';
  document.getElementById('messagesList').innerHTML   = loadingState();

  clearSearch();
  await loadMessages(user);
}

async function loadMessages(user) {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  try {
    const msgs = await fetchMessages(user.biz_id, user.raw);
    messages[user.id] = msgs;
    logger.info('loadMessages: загружено', msgs.length, 'сообщений для', user.name);

    if (activeUser && activeUser.id === user.id) {
      renderMessages(msgs);
      document.getElementById('headerStatus').textContent = `всего ${msgs.length}`;
    }
  } catch (err) {
    logger.error('loadMessages: ошибка', err);
    if (activeUser && activeUser.id === user.id) {
      document.getElementById('messagesList').innerHTML = `
        <div class="state-msg">
          <div class="icon">⚠️</div>
          Ошибка загрузки истории<br>
          <span style="font-size:10px;color:var(--text-dim);margin-top:4px">${esc(err.message)}</span>
        </div>`;
      document.getElementById('headerStatus').textContent = 'ошибка';
    }
  } finally {
    btn.classList.remove('spinning');
  }
}

async function refreshMessages() {
  if (!activeUser) return;
  logger.info('refreshMessages: ручное обновление для', activeUser.name);
  await loadMessages(activeUser);
}

function loadingState() {
  return `<div class="state-msg"><div class="icon" style="animation:spin 1s linear infinite">🔄</div>Загрузка диалога…</div>`;
}

// ══════════════════════════════════════════════════════════
// ОТРИСОВКА СООБЩЕНИЙ
// ══════════════════════════════════════════════════════════
function renderMessages(msgs, highlight) {
  const list = document.getElementById('messagesList');
  if (!msgs && activeUser) msgs = messages[activeUser.id] || [];
  if (!msgs) return;

  const wasAtBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 60;

  if (!msgs.length) {
    list.innerHTML = `<div class="state-msg"><div class="icon">📭</div>Нет сообщений</div>`;
    return;
  }

  // Перерисовываем только если изменился контент (оптимизация)
  const newHtml = msgs.map((msg, idx) => buildMsgHtml(msg, idx, highlight || '')).join('');
  if (list.innerHTML !== newHtml) {
    list.innerHTML = newHtml;
    if (wasAtBottom) list.scrollTop = list.scrollHeight;
  }
}

function buildMsgHtml(msg, idx, highlight) {
  const isMatched = highlight && (msg.text || '').toLowerCase().includes(highlight.toLowerCase());
  const classes   = 'msg incoming'
    + (msg.is_deleted ? ' is-deleted' : '')
    + (isMatched      ? ' highlighted' : '');

  const typeIcons = { text: '', photo: '🖼 ', voice: '🎙 ', video: '🎥 ', document: '📄 ' };
  const typeIcon  = typeIcons[msg.m_type] || '📎 ';
  let displayText = esc(msg.text || (msg.is_deleted ? '[текст удалён]' : '—'));

  if (highlight) {
    const rx = new RegExp(`(${escRx(highlight)})`, 'gi');
    displayText = displayText.replace(rx, '<mark>$1</mark>');
  }

  let badges = '';
  if (msg.is_deleted) badges += `<span class="badge badge-deleted">🗑 Удалено</span>`;
  if (msg.is_edited && !msg.is_deleted) badges += `<span class="badge badge-edited">✏️ Отредактировано</span>`;
  if (msg._isNew) badges += `<span class="badge badge-new">✦ Новое</span>`;

  let oldTextBlock = '';
  if (msg.is_edited && !msg.is_deleted && msg.old_text) {
    let oldDisplay = esc(msg.old_text);
    if (highlight) {
      const rx = new RegExp(`(${escRx(highlight)})`, 'gi');
      oldDisplay = oldDisplay.replace(rx, '<mark>$1</mark>');
    }
    oldTextBlock = `
      <div class="old-text-block">
        <div class="old-text-label">Было</div>
        ${oldDisplay}
      </div>`;
  }

  return `<div class="${classes}" data-idx="${idx}" data-mid="${msg.m_id}">
    <span class="msg-type-icon">${typeIcon}</span><span class="msg-text">${displayText}</span>
    ${oldTextBlock}
    <div class="msg-meta">
      ${badges}
      <span class="msg-time">${formatTs(msg.ts)}</span>
    </div>
  </div>`;
}

// ══════════════════════════════════════════════════════════
// ГЛОБАЛЬНЫЙ ПОИСК
// ══════════════════════════════════════════════════════════
function doSearch() {
  const query     = document.getElementById('searchInput').value.trim();
  const resultsEl = document.getElementById('searchResults');
  const countEl   = document.getElementById('searchCount');

  if (!query) {
    resultsEl.innerHTML = '<div class="no-results">Введите запрос для поиска</div>';
    countEl.textContent = '';
    if (activeUser) renderMessages();
    return;
  }

  const q = query.toLowerCase();

  const userMatches = [];
  accounts.forEach(acc => {
    (acc.users || []).forEach(u => {
      const uName = (u.name || '').toLowerCase();
      if (uName.includes(q) || ('@' + uName).includes(q)) {
        userMatches.push({ user: u, acc });
      }
    });
  });

  const msgMatches = [];
  Object.keys(messages).forEach(userId => {
    const userObj = findUserGlobal(userId);
    if (!userObj) return;
    messages[userId].forEach((msg, idx) => {
      if ((msg.text || '').toLowerCase().includes(q)) {
        msgMatches.push({ msg, userId, idx, user: userObj });
      }
    });
  });

  resultsEl.innerHTML = '';
  const total = userMatches.length + msgMatches.length;
  countEl.textContent = `Найдено: ${total}`;

  if (total === 0) {
    resultsEl.innerHTML = '<div class="no-results">Ничего не найдено</div>';
    return;
  }

  if (userMatches.length) {
    const label = document.createElement('div');
    label.className = 'search-section-label';
    label.textContent = 'Пользователи';
    resultsEl.appendChild(label);

    userMatches.forEach(item => {
      const u  = item.user;
      const rx = new RegExp(`(${escRx(q.replace(/^@/, ''))})`, 'gi');
      const hiName = esc(u.name || '').replace(rx, '<mark>$1</mark>');
      const chip = document.createElement('div');
      chip.className = 'user-result-chip';
      chip.innerHTML = `
        <div class="urc-avatar">${esc(u.initials || '??')}</div>
        <div class="urc-body">
          <div class="urc-name">${hiName}</div>
          <div class="urc-acct">📱 ${esc(item.acc.name || item.acc.id)}</div>
        </div>
      `;
      chip.onclick = async () => {
        if (!item.acc.open) { item.acc.open = true; buildUsersBar(); }
        await selectUser(u);
      };
      resultsEl.appendChild(chip);
    });
  }

  if (msgMatches.length) {
    const label = document.createElement('div');
    label.className = 'search-section-label';
    label.textContent = 'Сообщения';
    resultsEl.appendChild(label);

    msgMatches.forEach(item => {
      const div = document.createElement('div');
      div.className = 'search-result-item';
      const rx = new RegExp(`(${escRx(q)})`, 'gi');
      let snippet = esc(item.msg.text || '').replace(rx, '<mark>$1</mark>');
      div.innerHTML = `
        <div class="result-from">👤 ${esc(item.user.name)}</div>
        <div style="opacity:0.85">${snippet}</div>
        <div class="msg-time" style="margin-top:4px">${formatTs(item.msg.ts)}</div>
      `;
      div.onclick = async () => {
        if (activeUser?.id !== item.userId) await selectUser(item.user);
        renderMessages(messages[item.userId], query);
        setTimeout(() => {
          const target = document.querySelector(`.msg[data-idx="${item.idx}"]`);
          if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 80);
      };
      resultsEl.appendChild(div);
    });
  }

  // Подсвечиваем в открытом чате
  if (activeUser) renderMessages(messages[activeUser.id], query);
}

function findUserGlobal(id) {
  for (const acc of accounts) {
    const found = (acc.users || []).find(u => String(u.id) === String(id));
    if (found) return found;
  }
  return null;
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  document.getElementById('searchResults').innerHTML = '<div class="no-results">Введите запрос для поиска</div>';
  document.getElementById('searchCount').textContent = '';
  if (activeUser) renderMessages();
}

// ══════════════════════════════════════════════════════════
// УТИЛИТЫ
// ══════════════════════════════════════════════════════════
function esc(s) {
  if (!s) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function escRx(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function formatTs(ts) {
  if (!ts) return '';
  try {
    const d = new Date(ts.replace(' ', 'T'));
    if (isNaN(d)) return ts;
    const today = new Date();
    const sameDay = d.toDateString() === today.toDateString();
    if (sameDay) return d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' })
      + ' ' + d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  } catch (e) { return ts; }
}

// ══════════════════════════════════════════════════════════
// TOGGLE ACCOUNTS PANEL
// ══════════════════════════════════════════════════════════
let accountsPanelOpen = true;

function toggleAccountsPanel() {
  const shell = document.querySelector('.shell');
  const arrow = document.getElementById('panelArrow');
  accountsPanelOpen = !accountsPanelOpen;
  if (accountsPanelOpen) {
    shell.classList.remove('accounts-collapsed');
    arrow.textContent = '◀';
    pollActive = true;
    setLiveDot('ok');
  } else {
    shell.classList.add('accounts-collapsed');
    arrow.textContent = '▶';
  }
}
