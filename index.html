<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Мессенджер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Onest:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:          #0d1520;
  --surface:     #131f2e;
  --panel:       #1e2a3a;
  --panel-deep:  #162030;
  --border:      #2a3f58;
  --border-lite: #243348;
  --accent:      #2e6da4;
  --accent-hi:   #5aabf0;
  --accent-glow: rgba(90,171,240,0.18);
  --text:        #d0e4f5;
  --text-soft:   #6a8aaa;
  --text-dim:    #3a5570;
  --highlight:   rgba(90,171,240,0.28);
  --green:       #3effa0;
  --red:         #ff5c6a;
  --yellow:      #ffd166;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Onest', sans-serif;
  background: var(--bg);
  height: 100vh;
  height: 100dvh;
  display: flex;
  margin: 0;
  padding: 0;
  overflow: hidden;
}

/* ── SHELL GRID (3 колонки: Аккаунты слева, чат в центре, поиск справа) ── */
.shell {
  width: 100%;
  height: 100vh;
  height: 100dvh;
  background: var(--surface);
  overflow: hidden;
  display: grid;
  grid-template-columns: 240px 1fr 260px;
}

/* ── ЛЕВАЯ ПАНЕЛЬ АККАУНТОВ ── */
.accounts-zone {
  background: var(--panel-deep);
  border-right: 2px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.accounts-header {
  background: var(--panel);
  padding: 15px 12px;
  flex-shrink: 0;
  border-bottom: 2px solid var(--border);
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.accounts-header h3 {
  font-family: 'Unbounded', sans-serif;
  font-size: 9px; font-weight: 700;
  color: var(--text-soft);
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.accounts-header .count-badge {
  font-family: 'Unbounded', sans-serif;
  font-size: 9px; font-weight: 700;
  color: var(--accent-hi);
  background: rgba(90,171,240,0.12);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 2px 6px;
  flex-shrink: 0;
}

.users-bar {
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
  flex: 1;
}
.users-bar::-webkit-scrollbar { width: 4px; }
.users-bar::-webkit-scrollbar-track { background: transparent; }
.users-bar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* ── АККАУНТ-ГРУППА (КАТЕГОРИИ ИЗ INDEX 5) ── */
.account-group { 
  border-bottom: 1px solid var(--border-lite); 
}

.account-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  cursor: pointer;
  background: var(--panel);
  transition: background 0.15s;
  position: sticky;
  top: 0;
  z-index: 2;
  user-select: none;
}
.account-row:hover { background: rgba(255,255,255,0.05); }
.account-row.open  { background: rgba(90,171,240,0.08); }

.account-row .acc-avatar {
  width: 28px; height: 28px;
  border-radius: 4px;
  background: rgba(90,171,240,0.15);
  color: var(--accent-hi);
  font-family: 'Unbounded', sans-serif;
  font-size: 9px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  border: 1px solid var(--border);
}
.account-row .acc-body { flex: 1; min-width: 0; }
.account-row .acc-name {
  font-family: 'Unbounded', sans-serif;
  font-size: 10px; font-weight: 700;
  color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.account-row .acc-sub {
  font-size: 10px; color: var(--text-dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.account-row .acc-toggle {
  font-size: 10px; color: var(--text-dim);
  transition: transform 0.2s;
  flex-shrink: 0;
}
.account-row.open .acc-toggle { transform: rotate(90deg); }

.account-users {
  display: none;
  flex-direction: column;
  gap: 4px;
  padding: 5px 7px 7px 7px;
  background: var(--panel-deep);
}
.account-users.open { display: flex; }

/* Loading skeleton chips */
.chip-skeleton {
  width: 100%;
  height: 38px;
  border-radius: 5px;
  background: linear-gradient(90deg, var(--panel-deep) 25%, var(--border) 50%, var(--panel-deep) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
  flex-shrink: 0;
  margin: 5px 0;
}
@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* ── ЧИП ПОЛЬЗОВАТЕЛЯ ── */
.user-chip {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(90,171,240,0.04);
  border: 2px solid var(--border-lite);
  border-radius: 5px;
  padding: 6px 10px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, transform 0.12s, box-shadow 0.15s;
  flex-shrink: 0;
  width: 100%;
}
.user-chip:hover {
  background: rgba(255,255,255,0.07);
  border-color: #fff;
  box-shadow: 0 0 0 1px #fff, 0 4px 14px rgba(0,0,0,0.4);
  transform: translateX(2px);
}
.user-chip:hover .chip-name { color: #fff; }
.user-chip:hover .avatar    { border-color: #fff; color: #fff; }
.user-chip.active {
  background: var(--accent);
  border-color: var(--accent-hi);
  box-shadow: 0 0 0 1px var(--accent-hi);
}
.user-chip.active .chip-name { color: #fff; font-weight: 700; }
.user-chip.active .avatar    { background: rgba(255,255,255,0.15); color: #fff; border-color: rgba(255,255,255,0.3); }

.avatar {
  width: 27px; height: 27px;
  border-radius: 4px;
  background: rgba(90,171,240,0.12);
  color: var(--accent-hi);
  font-family: 'Unbounded', sans-serif;
  font-size: 9px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  border: 1px solid var(--border);
  transition: border-color 0.15s, color 0.15s;
}
.chip-body { flex: 1; min-width: 0; }
.chip-name {
  font-size: 12px; font-weight: 500;
  color: #8ab4d8;
  transition: color 0.15s;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.chip-sub {
  font-size: 9px; color: var(--text-dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px;
}
.user-chip.active .chip-sub { color: rgba(255,255,255,0.5); }

/* ── MESSAGES ZONE ── */
.messages-zone {
  background: var(--panel-deep);
  border-right: 2px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

.no-user-placeholder {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text-dim);
  gap: 10px;
  padding: 30px;
  text-align: center;
}
.no-user-placeholder .icon { font-size: 44px; opacity: 0.25; }
.no-user-placeholder p {
  font-family: 'Unbounded', sans-serif;
  font-size: 12px; font-weight: 600;
  color: var(--text-dim);
}

#chatArea {
  display: none;
  flex: 1;
  flex-direction: column;
  overflow: hidden;
}
#chatArea.visible { display: flex; }

.messages-header {
  background: var(--panel);
  padding: 11px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  border-bottom: 2px solid var(--border);
  height: 56px;
}
.messages-header .avatar-lg {
  width: 34px; height: 34px;
  border-radius: 5px;
  background: rgba(90,171,240,0.12);
  color: var(--accent-hi);
  font-family: 'Unbounded', sans-serif;
  font-size: 11px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  border: 2px solid var(--border);
}
.messages-header .user-info  { flex: 1; min-width: 0; }
.messages-header .user-name  {
  font-family: 'Unbounded', sans-serif;
  font-size: 13px; font-weight: 700;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.messages-header .user-status {
  font-size: 11px;
  color: var(--text-soft);
  margin-top: 2px;
}

.refresh-btn {
  background: transparent;
  border: 1.5px solid var(--border);
  border-radius: 5px;
  padding: 5px 9px;
  color: var(--text-soft);
  font-size: 14px;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s, transform 0.2s;
  flex-shrink: 0;
}
.refresh-btn:hover { border-color: var(--accent-hi); color: var(--accent-hi); }
.refresh-btn.spinning { animation: spin 0.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.messages-list {
  flex: 1;
  overflow-y: auto;
  padding: 16px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  scroll-behavior: smooth;
}
.messages-list::-webkit-scrollbar { width: 4px; }
.messages-list::-webkit-scrollbar-track { background: transparent; }
.messages-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.msg {
  max-width: 78%;
  padding: 9px 13px;
  border-radius: 6px;
  font-size: 13px;
  line-height: 1.55;
  color: var(--text);
  transition: background 0.2s;
}
.msg.incoming {
  background: var(--panel);
  border: 2px solid var(--border);
  align-self: flex-start;
  border-bottom-left-radius: 2px;
}
.msg.outgoing {
  background: var(--accent);
  border: 2px solid var(--accent-hi);
  align-self: flex-end;
  border-bottom-right-radius: 2px;
  color: #fff;
}

.msg-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 5px;
  flex-wrap: wrap;
}
.msg-time {
  font-size: 10px;
  color: var(--text-soft);
  opacity: 0.7;
  margin-left: auto;
}
.msg.outgoing .msg-time { color: rgba(255,255,255,0.6); }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 9px;
  font-family: 'Unbounded', sans-serif;
  font-weight: 700;
  letter-spacing: 0.06em;
  padding: 2px 6px;
  border-radius: 3px;
  flex-shrink: 0;
}
.badge-edited {
  background: rgba(255,209,102,0.15);
  color: var(--yellow);
  border: 1px solid rgba(255,209,102,0.35);
}
.badge-deleted {
  background: rgba(255,92,106,0.12);
  color: var(--red);
  border: 1px solid rgba(255,92,106,0.3);
}

.msg.is-deleted {
  opacity: 0.52;
}
.msg.is-deleted .msg-text {
  text-decoration: line-through;
  text-decoration-color: var(--red);
}

.old-text-block {
  margin-top: 5px;
  padding: 5px 8px;
  background: rgba(0,0,0,0.25);
  border-left: 2px solid rgba(255,209,102,0.4);
  border-radius: 3px;
  font-size: 11px;
  color: var(--text-soft);
  font-style: italic;
}
.old-text-label {
  font-size: 9px;
  font-family: 'Unbounded', sans-serif;
  font-weight: 700;
  color: var(--yellow);
  opacity: 0.7;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 2px;
}

.msg-type-icon {
  font-size: 11px;
  opacity: 0.65;
}

.msg.highlighted {
  background: rgba(90,171,240,0.25) !important;
  border-color: var(--accent-hi) !important;
  outline: 1px solid var(--accent-hi);
}
mark {
  background: var(--highlight);
  color: #fff;
  border-radius: 2px;
  padding: 0 2px;
}

/* ── SEARCH ZONE ── */
.search-zone {
  background: var(--panel-deep);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.search-header {
  background: var(--panel);
  padding: 11px 12px;
  flex-shrink: 0;
  border-bottom: 2px solid var(--border);
  height: 56px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.search-header h3 {
  font-family: 'Unbounded', sans-serif;
  font-size: 9px; font-weight: 700;
  color: var(--text-soft);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 5px;
}
.search-input-wrap {
  display: flex;
  gap: 5px;
}
.search-input-wrap input {
  flex: 1;
  background: var(--panel-deep);
  border: 2px solid var(--border);
  border-radius: 5px;
  padding: 5px 9px;
  font-family: 'Onest', sans-serif;
  font-size: 12px;
  color: var(--text);
  outline: none;
  transition: border-color 0.15s;
}
.search-input-wrap input::placeholder { color: var(--text-dim); }
.search-input-wrap input:focus { border-color: var(--accent-hi); }
.search-input-wrap button {
  background: var(--border);
  border: 2px solid var(--border);
  border-radius: 5px;
  padding: 5px 9px;
  color: var(--text-soft);
  font-size: 11px;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.search-input-wrap button:hover { background: var(--accent); color: #fff; border-color: var(--accent-hi); }
.search-count { font-size: 10px; color: var(--accent-hi); opacity: 0.8; margin-top: 2px; }

.search-results {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

.search-section-label {
  font-family: 'Unbounded', sans-serif;
  font-size: 8px; font-weight: 700;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  padding: 6px 4px 2px;
}

.search-result-item {
  background: var(--panel);
  border: 2px solid var(--border-lite);
  border-radius: 5px;
  padding: 8px 10px;
  cursor: pointer;
  transition: border-color 0.15s, transform 0.12s, background 0.15s;
  font-size: 12px;
  color: var(--text);
  line-height: 1.5;
}
.search-result-item:hover { border-color: var(--accent-hi); background: var(--accent-glow); transform: translateX(-2px); }
.search-result-item .result-from {
  font-family: 'Unbounded', sans-serif;
  font-size: 8px; font-weight: 700;
  color: var(--accent-hi);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 3px;
  opacity: 0.8;
}
.search-result-item .result-account { font-size: 9px; color: var(--text-dim); margin-bottom: 2px; }

/* Пользователь в глобальном поиске */
.user-result-chip {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--panel);
  border: 2px solid var(--border-lite);
  border-radius: 5px;
  padding: 7px 9px;
  cursor: pointer;
  transition: border-color 0.15s, transform 0.12s, background 0.15s;
}
.user-result-chip:hover { border-color: var(--accent-hi); background: var(--accent-glow); transform: translateX(-2px); }
.user-result-chip .urc-avatar {
  width: 26px; height: 26px; border-radius: 4px;
  background: rgba(90,171,240,0.12); color: var(--accent-hi);
  font-family: 'Unbounded', sans-serif; font-size: 8px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; border: 1px solid var(--border);
}
.user-result-chip .urc-body { flex: 1; min-width: 0; }
.user-result-chip .urc-name { font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-result-chip .urc-sub  { font-size: 10px; color: var(--text-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-result-chip .urc-acct { font-size: 9px; color: var(--text-dim); margin-top: 1px; }

.no-results {
  padding: 20px;
  text-align: center;
  color: var(--text-dim);
  font-size: 11px;
  font-family: 'Unbounded', sans-serif;
  font-weight: 600;
}

.state-msg {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 24px;
  color: var(--text-dim);
  font-size: 11px;
  font-family: 'Unbounded', sans-serif;
  font-weight: 600;
  text-align: center;
  flex: 1;
}
.state-msg .icon { font-size: 28px; opacity: 0.3; }

/* ── МЕДИА В СООБЩЕНИЯХ ── */
.media-wrap {
  margin-bottom: 4px;
  max-width: 100%;
}

.media-photo {
  display: block;
  max-width: 280px;
  max-height: 320px;
  width: 100%;
  border-radius: 6px;
  object-fit: cover;
  cursor: zoom-in;
  border: 1.5px solid var(--border);
  transition: opacity 0.15s;
}
.media-photo:hover { opacity: 0.88; }

.media-video {
  display: block;
  max-width: 280px;
  max-height: 280px;
  width: 100%;
  border-radius: 6px;
  border: 1.5px solid var(--border);
  background: #000;
}

/* Кружок (video_note) */
.media-circle {
  display: block;
  width: 200px;
  height: 200px;
  border-radius: 50%;
  object-fit: cover;
  border: 2.5px solid var(--accent-hi);
  background: #000;
}

/* Голосовое / аудио */
.media-voice {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--panel);
  border: 1.5px solid var(--border);
  border-radius: 22px;
  padding: 6px 12px;
  max-width: 280px;
}
.voice-icon { font-size: 18px; flex-shrink: 0; }
.voice-audio {
  flex: 1;
  height: 28px;
  min-width: 0;
  accent-color: var(--accent-hi);
}

/* Документ */
.media-doc {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--panel);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 9px 13px;
  text-decoration: none;
  max-width: 280px;
  transition: border-color 0.15s, background 0.15s;
}
.media-doc:hover {
  border-color: var(--accent-hi);
  background: var(--accent-glow);
}
.doc-icon { font-size: 22px; flex-shrink: 0; }
.doc-info { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.doc-name {
  font-size: 12px; font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 180px;
}
.doc-dl { font-size: 10px; color: var(--accent-hi); }

/* Стикер */
.media-sticker {
  display: block;
  width: 120px;
  height: 120px;
  object-fit: contain;
}

/* Подпись к медиа */
.media-caption {
  font-size: 13px;
  line-height: 1.5;
  color: var(--text);
  margin-top: 5px;
}

/* ── ОВЕРЛЕЙ ДЛЯ ПРОСМОТРА ФОТО ── */
#mediaOverlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.88);
  z-index: 9999;
  align-items: center;
  justify-content: center;
  cursor: zoom-out;
}
#mediaOverlay img {
  max-width: 92vw;
  max-height: 92vh;
  border-radius: 8px;
  box-shadow: 0 8px 48px rgba(0,0,0,0.6);
  object-fit: contain;
  pointer-events: none;
}

/* ── Мобильная адаптация ── */
@media (max-width: 768px) {
  .shell {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr auto;
  }
  .accounts-zone {
    max-height: 25vh;
    border-right: none;
    border-bottom: 2px solid var(--border);
  }
  .search-zone {
    max-height: 30vh;
    border-top: 2px solid var(--border);
  }
  .msg { max-width: 90%; }
}
</style>
</head>
<body>

<div class="shell">
  <div class="accounts-zone">
    <div class="accounts-header">
      <h3>👥 Аккаунты</h3>
      <span class="count-badge" id="accountsCount">0</span>
    </div>
    <div class="users-bar" id="usersBar">
      <div class="chip-skeleton"></div>
      <div class="chip-skeleton"></div>
      <div class="chip-skeleton"></div>
      <div class="chip-skeleton"></div>
    </div>
  </div>

  <div class="messages-zone" id="messagesZone">
    <div class="no-user-placeholder" id="noUserPlaceholder">
      <div class="icon">💬</div>
      <p>Выберите пользователя<br>в левой панели</p>
    </div>

    <div id="chatArea">
      <div class="messages-header">
        <div class="avatar-lg" id="headerAvatar"></div>
        <div class="user-info">
          <div class="user-name" id="headerName"></div>
          <div class="user-status" id="headerStatus"></div>
        </div>
        <button class="refresh-btn" id="refreshBtn" title="Обновить" onclick="refreshMessages()">↻</button>
      </div>
      <div class="messages-list" id="messagesList"></div>
    </div>
  </div>

  <div class="search-zone">
    <div class="search-header">
      <h3>🔍 Поиск</h3>
      <div class="search-input-wrap">
        <input type="text" id="searchInput" placeholder="Сообщение, имя, @username…" oninput="doSearch()" />
        <button onclick="clearSearch()">✕</button>
      </div>
      <div class="search-count" id="searchCount"></div>
    </div>
    <div class="search-results" id="searchResults">
      <div class="no-results">Введите запрос для поиска</div>
    </div>
  </div>
</div>

<!-- Оверлей для просмотра фото -->
<div id="mediaOverlay" onclick="document.getElementById('mediaOverlay').style.display='none'">
  <img id="mediaOverlayImg" src="" alt="">
</div>

<script>
if (window.Telegram && window.Telegram.WebApp) {
  window.Telegram.WebApp.ready();
  window.Telegram.WebApp.expand();
}

const API_BASE = 'https://aerov11.github.io/b9f2e4c8a17d4e3f89a2bc1d0e5f6a7b/';
let accounts = []; // [ { id, name, initials, username?, open?, users:[] } ]
let messages = {}; // { userId: [...] }
let activeUser = null;

// ══════════════════════════════════════
// API ЗАПРОСЫ
// ══════════════════════════════════════
async function fetchUsers() {
  const resp = await fetch(`${API_BASE}/api/users`);
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  return resp.json();
}

async function fetchMessages(bizId, encoded) {
  const resp = await fetch(`${API_BASE}/api/messages/${encodeURIComponent(bizId)}/${encoded}`);
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  return resp.json();
}

async function init() {
  try {
    accounts = await fetchUsers();
    
    // По умолчанию раскрываем все аккаунты
    accounts.forEach(acc => {
      if (acc.open === undefined) acc.open = true;
    });
    
    buildUsersBar();
  } catch (err) {
    console.error('Ошибка загрузки пользователей:', err);
    const bar = document.getElementById('usersBar');
    bar.innerHTML = `<div style="color:var(--red);font-size:11px;padding:14px;font-family:'Onest',sans-serif;">⚠️ Не удалось загрузить пользователей. Проверьте API.</div>`;
    document.getElementById('accountsCount').textContent = '0';
  }
}

// ══════════════════════════════════════
// ПОСТРОЕНИЕ ДРЕВА АККАУНТОВ И ПОЛЬЗОВАТЕЛЕЙ
// ══════════════════════════════════════
function buildUsersBar() {
  const bar = document.getElementById('usersBar');
  bar.innerHTML = '';
  
  document.getElementById('accountsCount').textContent = accounts.length;
  
  if (!accounts.length) {
    bar.innerHTML = `<div class="no-results" style="padding:20px">Нет аккаунтов</div>`;
    return;
  }

  accounts.forEach(acc => {
    const group = document.createElement('div');
    group.className = 'account-group';

    // 1. Строка аккаунта (категории)
    const row = document.createElement('div');
    row.className = 'account-row' + (acc.open ? ' open' : '');
    row.innerHTML = `
      <div class="acc-avatar">${esc(acc.initials)}</div>
      <div class="acc-body">
        <div class="acc-name">${esc(acc.name)}</div>
        ${acc.username ? `<div class="acc-sub">@${esc(acc.username)}</div>` : `<div class="acc-sub">${acc.users.length} чатов</div>`}
      </div>
      <span class="acc-toggle">›</span>
    `;
    row.onclick = () => {
      acc.open = !acc.open;
      buildUsersBar();
    };
    group.appendChild(row);

    // 2. Контейнер пользователей
    const userList = document.createElement('div');
    userList.className = 'account-users' + (acc.open ? ' open' : '');

    if (acc.open) {
      // Считаем дубликаты имён внутри текущего аккаунта
      const nameCounts = {};
      acc.users.forEach(u => {
        nameCounts[u.name] = (nameCounts[u.name] || 0) + 1;
      });

      acc.users.forEach(u => {
        const chip = document.createElement('div');
        const isActive = activeUser && activeUser.id === u.id;
        chip.className = 'user-chip' + (isActive ? ' active' : '');
        chip.dataset.id = u.id;

        const hasDupe = nameCounts[u.name] > 1;
        const nameHtml = hasDupe 
          ? `${esc(u.name)} <span style="opacity:0.5;font-size:10px">#${u.id.slice(-4)}</span>` 
          : esc(u.name);

        chip.innerHTML = `
          <div class="avatar">${esc(u.initials)}</div>
          <div class="chip-body">
            <div class="chip-name">${nameHtml}</div>
            ${u.username ? `<div class="chip-sub">@${esc(u.username)}</div>` : ''}
          </div>
        `;
        
        chip.onclick = () => selectUser(u);
        userList.appendChild(chip);
      });
    }
    
    group.appendChild(userList);
    bar.appendChild(group);
  });

  // Автоскролл к активному чипу чата
  requestAnimationFrame(() => {
    const active = bar.querySelector('.user-chip.active');
    if (active) active.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });
}

async function selectUser(user) {
  activeUser = user;
  buildUsersBar();
  
  document.getElementById('noUserPlaceholder').style.display = 'none';
  const chatArea = document.getElementById('chatArea');
  chatArea.classList.add('visible');
  
  document.getElementById('headerAvatar').textContent = user.initials;
  document.getElementById('headerName').textContent = user.name;
  document.getElementById('headerStatus').textContent = 'загрузка…';
  document.getElementById('messagesList').innerHTML = loadingState();
  
  clearSearch();
  await loadMessages(user);
}

async function loadMessages(user) {
  try {
    const btn = document.getElementById('refreshBtn');
    btn.classList.add('spinning');
    
    const msgs = await fetchMessages(user.biz_id, user.raw);
    messages[user.id] = msgs;
    
    if (activeUser && activeUser.id === user.id) {
      renderMessages(msgs);
      document.getElementById('headerStatus').textContent = `всего ${msgs.length}`;
    }
  } catch (err) {
    console.error(err);
    if (activeUser && activeUser.id === user.id) {
      document.getElementById('messagesList').innerHTML = `<div class="state-msg"><div class="icon">⚠️</div>Ошибка загрузки истории</div>`;
      document.getElementById('headerStatus').textContent = 'ошибка';
    }
  } finally {
    document.getElementById('refreshBtn').classList.remove('spinning');
  }
}

function refreshMessages() {
  if (activeUser) loadMessages(activeUser);
}

function loadingState() {
  return `
    <div class="state-msg">
      <div class="icon" style="animation: spin 1s linear infinite">🔄</div>
      Загрузка диалога…
    </div>
  `;
}

// ══════════════════════════════════════
// ОТРИСОВКА СООБЩЕНИЙ ЧАТА
// ══════════════════════════════════════
function buildMediaBlock(msg) {
  const type = msg.m_type;
  const url  = msg.file_url || msg.media_url || msg.url || null;
  if (!url) return '';

  if (type === 'photo') {
    return `<div class="media-wrap">
      <img src="${esc(url)}" class="media-photo" loading="lazy"
           onclick="openMediaFull(this.src)" alt="Фото">
    </div>`;
  }

  if (type === 'video') {
    return `<div class="media-wrap">
      <video src="${esc(url)}" class="media-video" controls preload="metadata"></video>
    </div>`;
  }

  if (type === 'video_note') {
    return `<div class="media-wrap">
      <video src="${esc(url)}" class="media-circle" controls preload="metadata"></video>
    </div>`;
  }

  if (type === 'voice') {
    return `<div class="media-wrap">
      <div class="media-voice">
        <span class="voice-icon">🎙</span>
        <audio src="${esc(url)}" controls preload="none" class="voice-audio"></audio>
      </div>
    </div>`;
  }

  if (type === 'audio') {
    const fname = msg.file_name || 'Аудио';
    return `<div class="media-wrap">
      <div class="media-voice">
        <span class="voice-icon">🎵</span>
        <div class="doc-info"><span class="doc-name">${esc(fname)}</span></div>
        <audio src="${esc(url)}" controls preload="none" class="voice-audio"></audio>
      </div>
    </div>`;
  }

  if (type === 'document') {
    const fname = msg.file_name || 'Документ';
    const ext   = fname.split('.').pop().toLowerCase();
    const icon  = { pdf:'📄', zip:'🗜', rar:'🗜', doc:'📝', docx:'📝',
                    xls:'📊', xlsx:'📊', ppt:'📋', pptx:'📋', mp3:'🎵',
                    mp4:'🎬', txt:'📃' }[ext] || '📎';
    return `<div class="media-wrap">
      <a href="${esc(url)}" target="_blank" class="media-doc" download>
        <span class="doc-icon">${icon}</span>
        <div class="doc-info">
          <span class="doc-name">${esc(fname)}</span>
          <span class="doc-dl">Скачать ↓</span>
        </div>
      </a>
    </div>`;
  }

  if (type === 'sticker') {
    return `<div class="media-wrap">
      <img src="${esc(url)}" class="media-sticker" loading="lazy" alt="Стикер">
    </div>`;
  }

  // Неизвестный тип, но есть URL — ссылка
  return `<div class="media-wrap">
    <a href="${esc(url)}" target="_blank" class="media-doc">
      <span class="doc-icon">📎</span>
      <div class="doc-info"><span class="doc-name">Вложение</span><span class="doc-dl">Открыть ↗</span></div>
    </a>
  </div>`;
}

function openMediaFull(src) {
  const ov = document.getElementById('mediaOverlay');
  const im = document.getElementById('mediaOverlayImg');
  im.src = src;
  ov.style.display = 'flex';
}

function renderMessages(msgs = null, highlight = '') {
  const list = document.getElementById('messagesList');
  if (!msgs && activeUser) msgs = messages[activeUser.id] || [];
  if (!msgs) return;

  if (!msgs.length) {
    list.innerHTML = `<div class="state-msg"><div class="icon">📭</div>Нет сообщений</div>`;
    return;
  }

  list.innerHTML = '';
  msgs.forEach((msg, idx) => {
    const div = document.createElement('div');
    const isMatched = highlight && (msg.text || '').toLowerCase().includes(highlight.toLowerCase());
    div.className = 'msg incoming' + (msg.is_deleted ? ' is-deleted' : '') + (isMatched ? ' highlighted' : '');
    div.dataset.idx = idx;

    // Иконка типа (только для не-медиа или когда нет URL)
    const hasMedia = msg.m_type && msg.m_type !== 'text';
    const typeIcons = { text: '', photo: '🖼 ', voice: '🎙 ', video: '🎥 ',
                        video_note: '⭕ ', document: '📄 ', audio: '🎵 ',
                        sticker: '🎉 ' };
    const typeIcon = hasMedia ? (typeIcons[msg.m_type] || '📎 ') : '';

    let displayText = esc(msg.text || (msg.is_deleted ? '[текст удалён]' : ''));

    if (highlight) {
      const rx = new RegExp(`(${escRx(highlight)})`, 'gi');
      displayText = displayText.replace(rx, '<mark>$1</mark>');
    }

    let badges = '';
    if (msg.is_deleted) {
      badges += `<span class="badge badge-deleted">🗑 Удалено</span>`;
    }
    if (msg.is_edited && !msg.is_deleted) {
      badges += `<span class="badge badge-edited">✏️ Отредактировано</span>`;
    }

    let oldTextBlock = '';
    if (msg.is_edited && !msg.is_deleted && msg.old_text) {
      let oldDisplay = esc(msg.old_text);
      if (highlight) {
        const rx = new RegExp(`(${escRx(highlight)})`, 'gi');
        oldDisplay = oldDisplay.replace(rx, '<mark>$1</mark>');
      }
      oldTextBlock = `
        <div class="old-text-block">
          <div class="old-text-label">Было</div>
          ${oldDisplay}
        </div>`;
    }

    // Медиа-блок (фото/видео/аудио/документ и т.д.)
    const mediaBlock = msg.is_deleted ? '' : buildMediaBlock(msg);

    // Подпись к медиа — только если есть и медиа, и текст
    const captionBlock = (mediaBlock && displayText)
      ? `<div class="media-caption">${displayText}</div>`
      : (displayText ? `<span class="msg-text">${displayText}</span>` : '');

    div.innerHTML = `
      ${mediaBlock}
      ${captionBlock}
      ${oldTextBlock}
      <div class="msg-meta">
        ${badges}
        <span class="msg-time">${formatTs(msg.ts)}</span>
      </div>`;
    list.appendChild(div);
  });

  list.scrollTop = list.scrollHeight;
}

// ══════════════════════════════════════
// ГЛОБАЛЬНЫЙ ПОИСК ПО СООБЩЕНИЯМ И ЮЗЕРАМ
// ══════════════════════════════════════
function doSearch() {
  const query = document.getElementById('searchInput').value.trim();
  const resultsEl = document.getElementById('searchResults');
  const countEl = document.getElementById('searchCount');

  if (!query) {
    resultsEl.innerHTML = '<div class="no-results">Введите запрос для поиска</div>';
    countEl.textContent = '';
    if (activeUser) renderMessages();
    return;
  }

  const q = query.toLowerCase();
  
  // 1. Ищем пользователей по всем аккаунтам
  const userMatches = [];
  accounts.forEach(acc => {
    acc.users.forEach(u => {
      const uName = (u.name || '').toLowerCase();
      const uUser = (u.username || '').toLowerCase();
      if (uName.includes(q) || uUser.includes(q) || ('@' + uUser).includes(q)) {
        userMatches.push({ user: u, acc: acc });
      }
    });
  });

  // 2. Ищем сообщения в загруженной кеш-истории
  const msgMatches = [];
  Object.keys(messages).forEach(userId => {
    const userObj = findUserGlobal(userId);
    if (!userObj) return;
    messages[userId].forEach((msg, idx) => {
      if ((msg.text || '').toLowerCase().includes(q)) {
        msgMatches.push({ msg, userId, idx, user: userObj });
      }
    });
  });

  resultsEl.innerHTML = '';
  const total = userMatches.length + msgMatches.length;
  countEl.textContent = `Найдено результатов: ${total}`;

  if (total === 0) {
    resultsEl.innerHTML = '<div class="no-results">Ничего не найдено</div>';
    return;
  }

  // Отрендерить найденных юзеров
  if (userMatches.length) {
    const label = document.createElement('div');
    label.className = 'search-section-label';
    label.textContent = 'Пользователи';
    resultsEl.appendChild(label);

    userMatches.forEach(item => {
      const u = item.user;
      const rx = new RegExp(`(${escRx(q.replace(/^@/, ''))})`, 'gi');
      const hiName = esc(u.name || '').replace(rx, '<mark>$1</mark>');
      const hiUser = u.username ? esc('@' + u.username).replace(rx, '<mark>$1</mark>') : '';
      const acctLine = `<div class="urc-acct">📱 ${esc(item.acc.name)}</div>`;

      const chip = document.createElement('div');
      chip.className = 'user-result-chip';
      chip.innerHTML = `
        <div class="urc-avatar">${esc(u.initials)}</div>
        <div class="urc-body">
          <div class="urc-name">${hiName}</div>
          ${hiUser ? `<div class="urc-sub">${hiUser}</div>` : ''}
          ${acctLine}
        </div>
      `;
      chip.onclick = async () => {
        if (!item.acc.open) {
          item.acc.open = true;
          buildUsersBar();
        }
        await selectUser(u);
      };
      resultsEl.appendChild(chip);
    });
  }

  // Отрендерить найденные сообщения
  if (msgMatches.length) {
    const label = document.createElement('div');
    label.className = 'search-section-label';
    label.textContent = 'Сообщения';
    resultsEl.appendChild(label);

    msgMatches.forEach(item => {
      const div = document.createElement('div');
      div.className = 'search-result-item';

      let textSnippet = esc(item.msg.text || '');
      const rx = new RegExp(`(${escRx(q)})`, 'gi');
      textSnippet = textSnippet.replace(rx, '<mark>$1</mark>');

      div.innerHTML = `
        <div class="result-from">👤 ${esc(item.user.name)}</div>
        <div style="opacity:0.85">${textSnippet}</div>
        <div class="msg-time" style="margin-top:4px">${formatTs(item.msg.ts)}</div>
      `;

      div.onclick = async () => {
        if (activeUser?.id !== item.userId) {
          await selectUser(item.user);
        }
        renderMessages(messages[item.userId], query);
        setTimeout(() => {
          const target = document.querySelector(`.msg[data-idx="${item.idx}"]`);
          if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 80);
      };
      resultsEl.appendChild(div);
    });
  }
}

function findUserGlobal(id) {
  for (const acc of accounts) {
    const found = acc.users.find(u => String(u.id) === String(id));
    if (found) return found;
  }
  return null;
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  document.getElementById('searchResults').innerHTML = '<div class="no-results">Введите запрос для поиска</div>';
  document.getElementById('searchCount').textContent = '';
  if (activeUser) renderMessages();
}

// ══════════════════════════════════════
// УТИЛИТЫ
// ══════════════════════════════════════
function esc(s) {
  if (!s) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function escRx(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function formatTs(ts) {
  if (!ts) return '';
  try {
    const d = new Date(ts.replace(' ', 'T'));
    if (isNaN(d)) return ts;
    const today = new Date();
    const sameDay = d.toDateString() === today.toDateString();
    if (sameDay) {
      return d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    }
    return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' })
      + ' ' + d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  } catch (e) { return ts; }
}

// Запуск приложения
init();
</script>
</body>
</html>
