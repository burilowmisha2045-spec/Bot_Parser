<!DOCTYPE html>
<html lang="ru">  
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Мессенджер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Onest:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:          #0d1520;
  --surface:     #131f2e;
  --panel:       #1e2a3a;
  --panel-deep:  #162030;
  --border:      #2a3f58;
  --border-lite: #243348;
  --accent:      #2e6da4;
  --accent-hi:   #5aabf0;
  --accent-glow: rgba(90,171,240,0.18);
  --text:        #d0e4f5;
  --text-soft:   #6a8aaa;
  --text-dim:    #3a5570;
  --highlight:   rgba(90,171,240,0.28);
  --green:       #3effa0;
  --red:         #ff5c6a;
  --yellow:      #ffd166;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Onest', sans-serif;
  background: var(--bg);
  height: 100vh;
  height: 100dvh;
  display: flex;
  margin: 0;
  padding: 0;
  overflow: hidden;
}

/* ── SHELL GRID (Изменено: 3 колонки. Аккаунты слева, чат в центре, поиск справа) ── */
.shell {
  width: 100%;
  height: 100vh;
  height: 100dvh;
  background: var(--surface);
  overflow: hidden;
  display: grid;
  grid-template-columns: 240px 1fr 260px;
}

/* ── ЛЕВАЯ ПАНЕЛЬ АККАУНТОВ ── */
.accounts-zone {
  background: var(--panel-deep);
  border-right: 2px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.accounts-header {
  background: var(--panel);
  padding: 15px 12px;
  flex-shrink: 0;
  border-bottom: 2px solid var(--border);
  height: 56px;
  display: flex;
  align-items: center;
}

.accounts-header h3 {
  font-family: 'Unbounded', sans-serif;
  font-size: 9px; font-weight: 700;
  color: var(--text-soft);
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

/* Изменено на вертикальное отображение списка аккаунтов */
.users-bar {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 10px 8px;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
  flex: 1;
}
.users-bar::-webkit-scrollbar { width: 4px; }
.users-bar::-webkit-scrollbar-track { background: transparent; }
.users-bar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* Loading skeleton chips */
.chip-skeleton {
  width: 100%;
  height: 38px;
  border-radius: 5px;
  background: linear-gradient(90deg, var(--panel-deep) 25%, var(--border) 50%, var(--panel-deep) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
  flex-shrink: 0;
}
@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

.user-chip {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(90,171,240,0.05);
  border: 2px solid var(--border-lite);
  border-radius: 5px;
  padding: 6px 10px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, transform 0.12s, box-shadow 0.15s;
  flex-shrink: 0;
  width: 100%;
}
.user-chip:hover {
  background: rgba(255,255,255,0.07);
  border-color: #fff;
  box-shadow: 0 0 0 1px #fff, 0 4px 14px rgba(0,0,0,0.4);
  transform: translateX(2px);
}
.user-chip:hover .chip-name { color: #fff; }
.user-chip:hover .avatar    { border-color: #fff; color: #fff; }
.user-chip.active {
  background: var(--accent);
  border-color: var(--accent-hi);
  box-shadow: 0 0 0 1px var(--accent-hi);
}
.user-chip.active .chip-name { color: #fff; font-weight: 700; }
.user-chip.active .avatar    { background: rgba(255,255,255,0.15); color: #fff; border-color: rgba(255,255,255,0.3); }

.avatar {
  width: 27px; height: 27px;
  border-radius: 4px;
  background: rgba(90,171,240,0.12);
  color: var(--accent-hi);
  font-family: 'Unbounded', sans-serif;
  font-size: 9px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  border: 1px solid var(--border);
  transition: border-color 0.15s, color 0.15s;
}
.chip-name {
  font-size: 12px; font-weight: 500;
  color: #8ab4d8;
  transition: color 0.15s;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ── MESSAGES ZONE ── */
.messages-zone {
  background: var(--panel-deep);
  border-right: 2px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

.no-user-placeholder {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text-dim);
  gap: 10px;
  padding: 30px;
  text-align: center;
}
.no-user-placeholder .icon { font-size: 44px; opacity: 0.25; }
.no-user-placeholder p {
  font-family: 'Unbounded', sans-serif;
  font-size: 12px; font-weight: 600;
  color: var(--text-dim);
}

#chatArea {
  display: none;
  flex: 1;
  flex-direction: column;
  overflow: hidden;
}
#chatArea.visible { display: flex; }

.messages-header {
  background: var(--panel);
  padding: 11px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  border-bottom: 2px solid var(--border);
  height: 56px;
}
.messages-header .avatar-lg {
  width: 34px; height: 34px;
  border-radius: 5px;
  background: rgba(90,171,240,0.12);
  color: var(--accent-hi);
  font-family: 'Unbounded', sans-serif;
  font-size: 11px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  border: 2px solid var(--border);
}
.messages-header .user-info  { flex: 1; min-width: 0; }
.messages-header .user-name  {
  font-family: 'Unbounded', sans-serif;
  font-size: 13px; font-weight: 700;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.messages-header .user-status {
  font-size: 11px;
  color: var(--text-soft);
  margin-top: 2px;
}

/* Кнопка обновления */
.refresh-btn {
  background: transparent;
  border: 1.5px solid var(--border);
  border-radius: 5px;
  padding: 5px 9px;
  color: var(--text-soft);
  font-size: 14px;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s, transform 0.2s;
  flex-shrink: 0;
}
.refresh-btn:hover { border-color: var(--accent-hi); color: var(--accent-hi); }
.refresh-btn.spinning { animation: spin 0.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.messages-list {
  flex: 1;
  overflow-y: auto;
  padding: 16px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  scroll-behavior: smooth;
}
.messages-list::-webkit-scrollbar { width: 4px; }
.messages-list::-webkit-scrollbar-track { background: transparent; }
.messages-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* ── СООБЩЕНИЕ ── */
.msg {
  max-width: 78%;
  padding: 9px 13px;
  border-radius: 6px;
  font-size: 13px;
  line-height: 1.55;
  color: var(--text);
  transition: background 0.2s;
}
.msg.incoming {
  background: var(--panel);
  border: 2px solid var(--border);
  align-self: flex-start;
  border-bottom-left-radius: 2px;
}
.msg.outgoing {
  background: var(--accent);
  border: 2px solid var(--accent-hi);
  align-self: flex-end;
  border-bottom-right-radius: 2px;
  color: #fff;
}

/* Строка под текстом: время + плашки статуса */
.msg-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 5px;
  flex-wrap: wrap;
}
.msg-time {
  font-size: 10px;
  color: var(--text-soft);
  opacity: 0.7;
  margin-left: auto;
}
.msg.outgoing .msg-time { color: rgba(255,255,255,0.6); }

/* Плашки статуса */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 9px;
  font-family: 'Unbounded', sans-serif;
  font-weight: 700;
  letter-spacing: 0.06em;
  padding: 2px 6px;
  border-radius: 3px;
  flex-shrink: 0;
}
.badge-edited {
  background: rgba(255,209,102,0.15);
  color: var(--yellow);
  border: 1px solid rgba(255,209,102,0.35);
}
.badge-deleted {
  background: rgba(255,92,106,0.12);
  color: var(--red);
  border: 1px solid rgba(255,92,106,0.3);
}

/* Удалённые сообщения — приглушённый вид */
.msg.is-deleted {
  opacity: 0.52;
}
.msg.is-deleted .msg-text {
  text-decoration: line-through;
  text-decoration-color: var(--red);
}

/* Блок "Было" для отредактированных */
.old-text-block {
  margin-top: 5px;
  padding: 5px 8px;
  background: rgba(0,0,0,0.25);
  border-left: 2px solid rgba(255,209,102,0.4);
  border-radius: 3px;
  font-size: 11px;
  color: var(--text-soft);
  font-style: italic;
}
.old-text-label {
  font-size: 9px;
  font-family: 'Unbounded', sans-serif;
  font-weight: 700;
  color: var(--yellow);
  opacity: 0.7;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 2px;
}

/* Иконка типа сообщения */
.msg-type-icon {
  font-size: 11px;
  opacity: 0.65;
}

/* Подсветка поиска */
.msg.highlighted {
  background: rgba(90,171,240,0.25) !important;
  border-color: var(--accent-hi) !important;
  outline: 1px solid var(--accent-hi);
}
mark {
  background: var(--highlight);
  color: #fff;
  border-radius: 2px;
  padding: 0 2px;
}

/* ── SEARCH ZONE ── */
.search-zone {
  background: var(--panel-deep);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.search-header {
  background: var(--panel);
  padding: 11px 12px;
  flex-shrink: 0;
  border-bottom: 2px solid var(--border);
  height: 56px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.search-header h3 {
  font-family: 'Unbounded', sans-serif;
  font-size: 9px; font-weight: 700;
  color: var(--text-soft);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 5px;
}
.search-input-wrap {
  display: flex;
  gap: 5px;
}
.search-input-wrap input {
  flex: 1;
  background: var(--panel-deep);
  border: 2px solid var(--border);
  border-radius: 5px;
  padding: 5px 9px;
  font-family: 'Onest', sans-serif;
  font-size: 12px;
  color: var(--text);
  outline: none;
  transition: border-color 0.15s;
}
.search-input-wrap input::placeholder { color: var(--text-dim); }
.search-input-wrap input:focus { border-color: var(--accent-hi); }
.search-input-wrap button {
  background: var(--border);
  border: 2px solid var(--border);
  border-radius: 5px;
  padding: 5px 9px;
  color: var(--text-soft);
  font-size: 11px;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.search-input-wrap button:hover { background: var(--accent); color: #fff; border-color: var(--accent-hi); }
.search-count {
  font-size: 10px;
  color: var(--accent-hi);
  opacity: 0.8;
  margin-top: 2px;
}
.search-results {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.search-result-item {
  background: var(--panel);
  border: 2px solid var(--border-lite);
  border-radius: 5px;
  padding: 8px 10px;
  cursor: pointer;
  transition: border-color 0.15s, transform 0.12s, background 0.15s;
  font-size: 12px;
  color: var(--text);
  line-height: 1.5;
}
.search-result-item:hover {
  border-color: var(--accent-hi);
  background: var(--accent-glow);
  transform: translateX(-2px);
}
.search-result-item .result-from {
  font-family: 'Unbounded', sans-serif;
  font-size: 8px; font-weight: 700;
  color: var(--accent-hi);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 3px;
  opacity: 0.8;
}
.no-results {
  padding: 20px;
  text-align: center;
  color: var(--text-dim);
  font-size: 11px;
  font-family: 'Unbounded', sans-serif;
  font-weight: 600;
}

/* ── Ошибка/пустой стейт ── */
.state-msg {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 24px;
  color: var(--text-dim);
  font-size: 11px;
  font-family: 'Unbounded', sans-serif;
  font-weight: 600;
  text-align: center;
  flex: 1;
}
.state-msg .icon { font-size: 28px; opacity: 0.3; }

/* ── Мобильная адаптация ── */
@media (max-width: 768px) {
  .shell {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr auto;
  }
  .accounts-zone {
    max-height: 25vh;
    border-right: none;
    border-bottom: 2px solid var(--border);
  }
  .search-zone {
    max-height: 30vh;
    border-top: 2px solid var(--border);
  }
  .msg { max-width: 90%; }
}
</style>
</head>
<body>

<div class="shell">

  <div class="accounts-zone">
    <div class="accounts-header">
      <h3>👥 Аккаунты</h3>
    </div>
    <div class="users-bar" id="usersBar">
      <div class="chip-skeleton"></div>
      <div class="chip-skeleton"></div>
      <div class="chip-skeleton"></div>
      <div class="chip-skeleton"></div>
    </div>
  </div>

  <div class="messages-zone" id="messagesZone">
    <div class="no-user-placeholder" id="noUserPlaceholder">
      <div class="icon">💬</div>
      <p>Выберите пользователя<br>в левой панели</p>
    </div>
    <div id="chatArea">
      <div class="messages-header" id="chatHeader">
        <div class="avatar-lg" id="headerAvatar"></div>
        <div class="user-info">
          <div class="user-name"   id="headerName"></div>
          <div class="user-status" id="headerStatus"></div>
        </div>
        <button class="refresh-btn" id="refreshBtn" title="Обновить" onclick="refreshMessages()">↻</button>
      </div>
      <div class="messages-list" id="messagesList"></div>
    </div>
  </div>

  <div class="search-zone">
    <div class="search-header">
      <h3>🔍 Поиск по сообщениям</h3>
      <div class="search-input-wrap">
        <input type="text" id="searchInput" placeholder="Введите слово..." oninput="doSearch()" />
        <button onclick="clearSearch()">✕</button>
      </div>
      <div class="search-count" id="searchCount"></div>
    </div>
    <div class="search-results" id="searchResults">
      <div class="no-results">Введите запрос для поиска</div>
    </div>
  </div>

</div>

<script>
// ══════════════════════════════════════════════════════════════════════════════
// TELEGRAM MINI APP INIT
// ══════════════════════════════════════════════════════════════════════════════
if (window.Telegram && window.Telegram.WebApp) {
  window.Telegram.WebApp.ready();
  window.Telegram.WebApp.expand();
}

const API_BASE = 'https://burilowmisha2045-spec.github.io/Bot_Parser/';

let users       = [];          
let messages    = {};          
let activeUser  = null;        

async function fetchUsers() {
  const resp = await fetch(`${API_BASE}/api/users`);
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  return resp.json();
}

async function fetchMessages(bizId, rawUserInfo) {
  const encoded = encodeURIComponent(rawUserInfo);
  const resp    = await fetch(`${API_BASE}/api/messages/${encodeURIComponent(bizId)}/${encoded}`);
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  return resp.json();
}

async function init() {
  try {
    users = await fetchUsers();
    buildUsersBar();
  } catch (err) {
    console.error('Ошибка загрузки пользователей:', err);
    const bar = document.getElementById('usersBar');
    bar.innerHTML = `<div style="color:var(--red);font-size:11px;padding:0 12px;font-family:'Onest',sans-serif;">
      ⚠️ Не удалось загрузить пользователей. Проверьте API.
    </div>`;
  }
}

function buildUsersBar() {
  const bar = document.getElementById('usersBar');
  bar.innerHTML = '';

  if (!users.length) {
    bar.innerHTML = `<div style="color:var(--text-dim);font-size:11px;padding:0 12px;font-family:'Unbounded',sans-serif;font-weight:600;">
      Нет данных
    </div>`;
    return;
  }

  const nameCounts = {};
  users.forEach(u => { nameCounts[u.name] = (nameCounts[u.name] || 0) + 1; });

  users.forEach(u => {
    const chip      = document.createElement('div');
    const isActive  = activeUser && activeUser.id === u.id;
    chip.className  = 'user-chip' + (isActive ? ' active' : '');
    chip.dataset.id = u.id;

    const hasDupe = nameCounts[u.name] > 1;
    const label   = hasDupe
      ? `${esc(u.name)} <span style="opacity:0.5;font-size:10px">#${u.id.slice(-4)}</span>`
      : esc(u.name);

    chip.innerHTML = `
      <div class="avatar">${esc(u.initials)}</div>
      <span class="chip-name">${label}</span>
    `;
    chip.onclick = () => selectUser(u);
    bar.appendChild(chip);
  });

  // Изменено на вертикальный скролл (block: 'nearest')
  requestAnimationFrame(() => {
    const active = bar.querySelector('.user-chip.active');
    if (active) active.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });
}

async function selectUser(user) {
  activeUser = user;
  buildUsersBar();

  document.getElementById('noUserPlaceholder').style.display = 'none';
  const chatArea = document.getElementById('chatArea');
  chatArea.classList.add('visible');

  document.getElementById('headerAvatar').textContent = user.initials;
  document.getElementById('headerName').textContent   = user.name;
  document.getElementById('headerStatus').textContent = 'загрузка…';
  document.getElementById('messagesList').innerHTML   = loadingState();

  clearSearch();
  await loadMessages(user);
}

async function loadMessages(user) {
  try {
    const btn  = document.getElementById('refreshBtn');
    btn.classList.add('spinning');

    const msgs  = await fetchMessages(user.biz_id, user.raw);
    messages[user.id] = msgs;

    const count = msgs.length;
    const last  = msgs.length ? msgs[msgs.length - 1] : null;
    document.getElementById('headerStatus').textContent = last
      ? `последнее: ${formatTs(last.ts)}`
      : `${count} сообщений`;

    renderMessages();
    btn.classList.remove('spinning');
  } catch (err) {
    console.error('Ошибка загрузки сообщений:', err);
    document.getElementById('headerStatus').textContent = 'ошибка загрузки';
    document.getElementById('messagesList').innerHTML = errorState('Не удалось загрузить сообщения');
    document.getElementById('refreshBtn').classList.remove('spinning');
  }
}

async function refreshMessages() {
  if (!activeUser) return;
  await loadMessages(activeUser);
}

function renderMessages(highlight = null) {
  if (!activeUser) return;
  const list = document.getElementById('messagesList');
  const msgs = messages[activeUser.id] || [];

  if (!msgs.length) {
    list.innerHTML = `<div class="state-msg"><div class="icon">📭</div>Нет сообщений</div>`;
    return;
  }

  list.innerHTML = '';

  msgs.forEach((msg, idx) => {
    const div = document.createElement('div');
    div.className = 'msg incoming' +
      (msg.is_deleted ? ' is-deleted' : '') +
      (highlight && msg.text.toLowerCase().includes(highlight.toLowerCase()) ? ' highlighted' : '');
    div.dataset.idx = idx;

    const typeIcons = { text: '', photo: '🖼 ', voice: '🎙 ', video: '🎥 ', document: '📄 ' };
    const typeIcon  = typeIcons[msg.m_type] || '📎 ';

    let displayText = esc(msg.text || (msg.is_deleted ? '[текст удалён]' : '—'));
    if (highlight) {
      const rx = new RegExp(`(${escRx(highlight)})`, 'gi');
      displayText = displayText.replace(rx, '<mark>$1</mark>');
    }

    let badges = '';
    if (msg.is_deleted) {
      badges += `<span class="badge badge-deleted">🗑 Удалено</span>`;
    }
    if (msg.is_edited && !msg.is_deleted) {
      badges += `<span class="badge badge-edited">✏️ Отредактировано</span>`;
    }

    let oldTextBlock = '';
    if (msg.is_edited && !msg.is_deleted && msg.old_text) {
      let oldDisplay = esc(msg.old_text);
      if (highlight) {
        const rx = new RegExp(`(${escRx(highlight)})`, 'gi');
        oldDisplay = oldDisplay.replace(rx, '<mark>$1</mark>');
      }
      oldTextBlock = `
        <div class="old-text-block">
          <div class="old-text-label">Было</div>
          ${oldDisplay}
        </div>`;
    }

    div.innerHTML = `
      <span class="msg-type-icon">${typeIcon}</span><span class="msg-text">${displayText}</span>
      ${oldTextBlock}
      <div class="msg-meta">
        ${badges}
        <span class="msg-time">${formatTs(msg.ts)}</span>
      </div>`;

    list.appendChild(div);
  });

  list.scrollTop = list.scrollHeight;
}

function doSearch() {
  const query      = document.getElementById('searchInput').value.trim();
  const resultsEl  = document.getElementById('searchResults');
  const countEl    = document.getElementById('searchCount');

  if (!query) {
    resultsEl.innerHTML = '<div class="no-results">Введите запрос для поиска</div>';
    countEl.textContent = '';
    if (activeUser) renderMessages();
    return;
  }

  if (activeUser) renderMessages(query);

  const found = [];
  users.forEach(u => {
    (messages[u.id] || []).forEach((msg, idx) => {
      const haystack = (msg.text + ' ' + (msg.old_text || '')).toLowerCase();
      if (haystack.includes(query.toLowerCase())) {
        found.push({ user: u, msg, idx });
      }
    });
  });

  countEl.textContent = found.length ? `Найдено: ${found.length}` : '';

  if (!found.length) {
    resultsEl.innerHTML = '<div class="no-results">Ничего не найдено</div>';
    return;
  }

  resultsEl.innerHTML = '';
  found.forEach(item => {
    const div   = document.createElement('div');
    div.className = 'search-result-item';
    const rx      = new RegExp(`(${escRx(query)})`, 'gi');
    const hiText  = esc(item.msg.text).replace(rx, '<mark>$1</mark>');

    const nameCounts = {};
    users.forEach(u => { nameCounts[u.name] = (nameCounts[u.name] || 0) + 1; });
    const label = nameCounts[item.user.name] > 1
      ? `${esc(item.user.name)} #${item.user.id.slice(-4)}`
      : esc(item.user.name);

    div.innerHTML = `
      <div class="result-from">${label} · ${formatTs(item.msg.ts)}</div>
      ${hiText}
    `;
    div.onclick = async () => {
      if (!activeUser || activeUser.id !== item.user.id) {
        await selectUser(item.user);
      }
      setTimeout(() => {
        renderMessages(query);
        const el = document.querySelectorAll('.msg')[item.idx];
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 80);
    };
    resultsEl.appendChild(div);
  });
}

function clearSearch() {
  document.getElementById('searchInput').value   = '';
  document.getElementById('searchResults').innerHTML = '<div class="no-results">Введите запрос для поиска</div>';
  document.getElementById('searchCount').textContent = '';
  if (activeUser) renderMessages();
}

function esc(s) {
  if (!s) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
function escRx(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function formatTs(ts) {
  if (!ts) return '';
  try {
    const d = new Date(ts.replace(' ', 'T'));
    if (isNaN(d)) return ts;
    const today = new Date();
    const sameDay = d.toDateString() === today.toDateString();
    if (sameDay) {
      return d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    }
    return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' })
      + ' ' + d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  } catch {
    return ts;
  }
}

function loadingState() {
  return `
    <div class="state-msg">
      <div class="icon" style="animation:spin 0.8s linear infinite;display:inline-block">⟳</div>
      Загрузка…
    </div>`;
}

function errorState(msg) {
  return `<div class="state-msg"><div class="icon">⚠️</div>${esc(msg)}</div>`;
}

init();
</script>
